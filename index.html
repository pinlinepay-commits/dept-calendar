<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部門共用月曆</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
    
    .status-normal { background-color: #ffffff; border-color: #e5e7eb; }
    .status-business { background-color: #fef08a !important; border-color: #fde047 !important; color: #854d0e !important; }
    .status-leave { background-color: #fecaca !important; border-color: #fca5a5 !important; color: #991b1b !important; }

    .holiday-cell { background-color: #f3f4f6 !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        
        <div class="flex items-center space-x-4">
          <div class="flex items-center space-x-2 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg font-bold">
            <i data-lucide="calendar" class="w-5 h-5"></i>
            <span>部門排程月曆</span>
          </div>
          
          <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg">
            <button id="prev-month" class="p-1.5 hover:bg-white rounded-md transition text-slate-600 hover:text-slate-900">
              <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <span id="current-month-display" class="px-3 font-semibold text-slate-700 min-w-[120px] text-center">
              2026 年 10 月
            </span>
            <button id="next-month" class="p-1.5 hover:bg-white rounded-md transition text-slate-600 hover:text-slate-900">
              <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
          </div>

          <button id="today-btn" class="text-xs bg-slate-200 hover:bg-slate-300 px-2.5 py-1.5 rounded-md font-medium text-slate-700 transition">
            今天
          </button>
        </div>

        <div class="flex items-center space-x-3 text-xs bg-slate-50 p-2 border border-slate-200 rounded-lg">
          <span class="text-slate-500 font-medium">行程狀態標記：</span>
          <span class="inline-flex items-center px-2 py-0.5 rounded border border-slate-200 bg-white text-slate-700">一般</span>
          <span class="inline-flex items-center px-2 py-0.5 rounded border border-yellow-300 bg-yellow-200 text-yellow-900 font-medium">🟡 出差拍攝</span>
          <span class="inline-flex items-center px-2 py-0.5 rounded border border-red-300 bg-red-200 text-red-900 font-medium">🔴 休假</span>
        </div>

        <div class="flex items-center space-x-2">
          <span id="sync-status" class="inline-flex items-center text-xs text-amber-600 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-full">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse mr-1.5"></span>
            連線設定中...
          </span>
        </div>

      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col">
    <div class="grid grid-cols-7 gap-1 bg-slate-200 p-1 rounded-t-xl text-center font-semibold text-sm text-slate-600">
      <div class="py-2 text-rose-600">日</div>
      <div class="py-2">一</div>
      <div class="py-2">二</div>
      <div class="py-2">三</div>
      <div class="py-2">四</div>
      <div class="py-2">五</div>
      <div class="py-2 text-rose-600">六</div>
    </div>

    <div id="calendar-grid" class="grid grid-cols-7 gap-1 bg-slate-200 p-1 rounded-b-xl flex-1 auto-rows-fr"></div>
  </main>

  <!-- 假期 / 灰底設定 Modal -->
  <div id="holiday-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-5 border border-slate-100">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="palmtree" class="w-5 h-5 text-indigo-600"></i>
          設定當天為假期 / 置灰
        </h3>
        <button id="close-holiday-modal" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <p id="modal-date-title" class="text-xs text-slate-500 mb-3 font-medium">2026-10-12</p>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">當天是否置灰 (非工作日)</label>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="is-holiday-checkbox" class="sr-only peer">
            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-slate-600"></div>
            <span class="ml-3 text-sm font-medium text-slate-700" id="holiday-toggle-text">一般工作日</span>
          </label>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">假期標籤名稱 (選填)</label>
          <input type="text" id="holiday-tag-input" placeholder="例如：元旦、端午節、團隊Building" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div class="flex justify-end space-x-2 pt-2">
          <button id="cancel-holiday-btn" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">取消</button>
          <button id="save-holiday-btn" class="px-4 py-2 text-xs font-medium bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg shadow-sm transition">儲存設定</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let calendarData = {};
    let activeModalDateKey = null;

    // 請在此處貼上您第一步取得的 Firebase 憑證：
const firebaseConfig = {
  apiKey: "AIzaSyBRwWTT8VpO6A8WNz2D6cC-fJBe7a2jQL4",
  authDomain: "line-pay-video2.firebaseapp.com",
  projectId: "line-pay-video2",
  storageBucket: "line-pay-video2.firebasestorage.app",
  messagingSenderId: "930321776775",
  appId: "1:930321776775:web:f4c73d787cfcfe2c38b822"
};

    let db = null;
    let isFirebaseActive = false;

    try {
      if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        isFirebaseActive = true;
        document.getElementById('sync-status').className = "inline-flex items-center text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full";
        document.getElementById('sync-status').innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span>雲端即時同步中`;
      }
    } catch (e) {
      console.log("Firebase 設定無效，使用單機模式");
    }

    function formatDateKey(year, month, day) {
      const m = String(month + 1).padStart(2, '0');
      const d = String(day).padStart(2, '0');
      return `${year}-${m}-${d}`;
    }

    function getDayData(dateKey) {
      return calendarData[dateKey] || {
        holiday: { isHoliday: false, tag: "" },
        dept: "",
        pin: { text: "", status: "normal" },
        yuanyuan: { text: "", status: "normal" }
      };
    }

    function saveData(dateKey, newData) {
      calendarData[dateKey] = newData;
      if (isFirebaseActive && db) {
        db.collection("calendar").doc(dateKey).set(newData, { merge: true });
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('current-month-display').innerText = `${year} 年 ${month + 1} 月`;

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const prevMonthDays = new Date(year, month, 0).getDate();
      for (let i = firstDayOfMonth - 1; i >= 0; i--) {
        grid.appendChild(createEmptyCell(prevMonthDays - i));
      }

      const today = new Date();
      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = formatDateKey(year, month, day);
        const dayData = getDayData(dateKey);
        const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
        
        grid.appendChild(createDateCell(year, month, day, dateKey, dayData, isToday));
      }

      const totalCellsSoFar = firstDayOfMonth + daysInMonth;
      const nextDays = (totalCellsSoFar > 35 ? 42 : 35) - totalCellsSoFar;
      for (let day = 1; day <= nextDays; day++) {
        grid.appendChild(createEmptyCell(day));
      }

      lucide.createIcons();
    }

    function createEmptyCell(day) {
      const cell = document.createElement('div');
      cell.className = 'bg-slate-100/60 p-1.5 min-h-[140px] rounded-lg text-slate-300 select-none flex flex-col justify-between opacity-50';
      cell.innerHTML = `<span class="text-xs font-semibold p-1">${day}</span>`;
      return cell;
    }

    function createDateCell(year, month, day, dateKey, dayData, isToday) {
      const cell = document.createElement('div');
      const isHoliday = dayData.holiday && dayData.holiday.isHoliday;
      
      cell.className = `bg-white p-2 min-h-[150px] rounded-lg flex flex-col justify-between transition-all relative border border-slate-200/80 shadow-sm hover:shadow-md ${isHoliday ? 'holiday-cell' : ''}`;

      const header = document.createElement('div');
      header.className = 'flex items-center justify-between mb-1.5';

      const dateNum = document.createElement('div');
      dateNum.className = 'flex items-center space-x-1.5';
      
      const daySpan = document.createElement('span');
      daySpan.className = `text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${isToday ? 'bg-indigo-600 text-white' : 'text-slate-700'}`;
      daySpan.innerText = day;
      dateNum.appendChild(daySpan);

      if (isHoliday && dayData.holiday.tag) {
        const tagSpan = document.createElement('span');
        tagSpan.className = 'text-[10px] font-bold bg-slate-600 text-white px-1.5 py-0.5 rounded shadow-sm';
        tagSpan.innerText = dayData.holiday.tag;
        dateNum.appendChild(tagSpan);
      }

      const holidayBtn = document.createElement('button');
      holidayBtn.className = 'text-slate-400 hover:text-slate-600 p-0.5 rounded transition opacity-60 hover:opacity-100';
      holidayBtn.title = "設定假期/置灰";
      holidayBtn.innerHTML = `<i data-lucide="settings" class="w-3.5 h-3.5"></i>`;
      holidayBtn.onclick = () => openHolidayModal(dateKey, dayData.holiday);

      header.appendChild(dateNum);
      header.appendChild(holidayBtn);

      const content = document.createElement('div');
      content.className = 'flex-1 flex flex-col space-y-1.5 text-xs';

      // 部門排程 (固定在最上方)
      const deptInput = document.createElement('input');
      deptInput.type = 'text';
      deptInput.placeholder = '＋ 部門 Deadline / 專案';
      deptInput.value = dayData.dept || '';
      deptInput.className = `w-full text-xs px-2 py-1 rounded font-semibold transition border border-dashed focus:border-solid border-slate-300 focus:ring-1 focus:ring-indigo-500 focus:bg-white focus:outline-none ${
        dayData.dept ? 'bg-blue-50 text-blue-900 border-blue-200' : 'bg-transparent text-slate-400 opacity-60 hover:opacity-100'
      }`;
      deptInput.onchange = (e) => {
        dayData.dept = e.target.value.trim();
        saveData(dateKey, dayData);
        renderCalendar();
      };
      content.appendChild(deptInput);

      // Pin
      content.appendChild(createMemberRow('Pin', dayData.pin, (newText, newStatus) => {
        dayData.pin = { text: newText, status: newStatus };
        saveData(dateKey, dayData);
      }));

      // 圓圓
      content.appendChild(createMemberRow('圓圓', dayData.yuanyuan, (newText, newStatus) => {
        dayData.yuanyuan = { text: newText, status: newStatus };
        saveData(dateKey, dayData);
      }));

      cell.appendChild(header);
      cell.appendChild(content);

      return cell;
    }

    function createMemberRow(memberName, memberData, onChange) {
      const container = document.createElement('div');
      container.className = 'flex items-center space-x-1';

      const label = document.createElement('span');
      label.className = 'text-[10px] font-medium text-slate-400 w-7 shrink-0';
      label.innerText = memberName;

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '行程...';
      input.value = memberData ? memberData.text : '';

      const currentStatus = memberData ? memberData.status || 'normal' : 'normal';
      input.className = `w-full text-xs px-2 py-1 rounded border transition focus:outline-none focus:ring-1 focus:ring-indigo-500 status-${currentStatus}`;

      const statusBtn = document.createElement('button');
      statusBtn.className = 'text-[10px] px-1 py-0.5 rounded border border-slate-200 hover:bg-slate-100 text-slate-500 shrink-0';
      
      if (currentStatus === 'business') statusBtn.innerText = '🟡';
      else if (currentStatus === 'leave') statusBtn.innerText = '🔴';
      else statusBtn.innerText = '⚪';

      input.onchange = (e) => {
        onChange(e.target.value.trim(), currentStatus);
      };

      statusBtn.onclick = () => {
        let nextStatus = 'normal';
        if (currentStatus === 'normal') nextStatus = 'business';
        else if (currentStatus === 'business') nextStatus = 'leave';
        else if (currentStatus === 'leave') nextStatus = 'normal';

        onChange(input.value.trim(), nextStatus);
        renderCalendar();
      };

      container.appendChild(label);
      container.appendChild(input);
      container.appendChild(statusBtn);

      return container;
    }

    function openHolidayModal(dateKey, holidayData) {
      activeModalDateKey = dateKey;
      const data = holidayData || { isHoliday: false, tag: '' };

      document.getElementById('modal-date-title').innerText = `設定日期：${dateKey}`;
      document.getElementById('is-holiday-checkbox').checked = data.isHoliday;
      document.getElementById('holiday-tag-input').value = data.tag || '';
      document.getElementById('holiday-toggle-text').innerText = data.isHoliday ? '灰底 (非工作日/假期)' : '一般工作日';

      document.getElementById('holiday-modal').classList.remove('hidden');
      document.getElementById('holiday-modal').classList.add('flex');
    }

    function closeHolidayModal() {
      document.getElementById('holiday-modal').classList.add('hidden');
      document.getElementById('holiday-modal').classList.remove('flex');
      activeModalDateKey = null;
    }

    document.getElementById('is-holiday-checkbox').onchange = (e) => {
      document.getElementById('holiday-toggle-text').innerText = e.target.checked ? '灰底 (非工作日/假期)' : '一般工作日';
    };

    document.getElementById('save-holiday-btn').onclick = () => {
      if (!activeModalDateKey) return;
      const isHoliday = document.getElementById('is-holiday-checkbox').checked;
      const tag = document.getElementById('holiday-tag-input').value.trim();

      const dayData = getDayData(activeModalDateKey);
      dayData.holiday = { isHoliday, tag };
      
      saveData(activeModalDateKey, dayData);
      closeHolidayModal();
      renderCalendar();
    };

    document.getElementById('close-holiday-modal').onclick = closeHolidayModal;
    document.getElementById('cancel-holiday-btn').onclick = closeHolidayModal;

    document.getElementById('prev-month').onclick = () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    };

    document.getElementById('next-month').onclick = () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    };

    document.getElementById('today-btn').onclick = () => {
      currentDate = new Date();
      renderCalendar();
    };

    if (isFirebaseActive && db) {
      db.collection("calendar").onSnapshot((snapshot) => {
        snapshot.forEach((doc) => {
          calendarData[doc.id] = doc.data();
        });
        renderCalendar();
      });
    }

    renderCalendar();
  </script>
</body>
</html>
